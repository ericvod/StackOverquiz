services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: stackoverquiz_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TEST_DB_PORT:-7204}:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stackoverquiz_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_test:
