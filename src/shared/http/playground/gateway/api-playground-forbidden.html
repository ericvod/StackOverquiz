<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="forbidden.pageTitle">Playground - Acesso negado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/playground/login-assets/api-playground-login.css" />
  </head>
  <body class="gateway-forbidden">
    <main class="gateway-layout">
      <section class="gateway-panel gateway-panel-danger">
        <p class="eyebrow" data-i18n="common.brandEyebrow">StackOverquiz Console Interno</p>
        <h1 data-i18n="forbidden.heading">Acesso negado</h1>

        <div class="gateway-language">
          <label for="gatewayLanguage" data-i18n="common.languageLabel">Idioma</label>
          <select id="gatewayLanguage" data-language-select>
            <option value="pt-BR" data-i18n="common.languagePt">Portugues (BR)</option>
            <option value="en" data-i18n="common.languageEn">English</option>
          </select>
        </div>

        <p class="intro" data-i18n="forbidden.message1">
          Sua conta foi autenticada, mas nao possui o papel admin necessario para acessar o playground operacional.
        </p>
        <p class="intro" data-i18n="forbidden.message2">
          Solicite a um administrador do projeto a concessao do papel admin antes de tentar novamente.
        </p>

        <div class="gateway-actions">
          <a class="gateway-link-button primary" href="/playground" data-i18n="forbidden.backToLogin">Voltar para login</a>
          <a class="gateway-link-button" href="/swagger" target="_blank" rel="noreferrer" data-i18n="common.openApiDocs">Abrir documentacao da API</a>
        </div>
      </section>

      <aside class="gateway-summary" aria-hidden="true"></aside>
    </main>

    <script src="/playground/login-assets/api-playground-gateway-i18n.js"></script>
  </body>
</html>
