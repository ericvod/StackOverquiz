<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="login.pageTitle">StackOverquiz Playground Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/playground/login-assets/api-playground-login.css" />
  </head>
  <body>
    <div class="ambient ambient-left"></div>
    <div class="ambient ambient-right"></div>

    <main class="gateway-layout">
      <section class="gateway-panel">
        <h1 data-i18n="login.heading">Acesso administrativo</h1>

        <form id="gatewayLoginForm" class="gateway-form" autocomplete="on">
          <label for="gatewayEmail" data-i18n="login.emailLabel">Email</label>
          <input
            id="gatewayEmail"
            name="email"
            type="email"
            autocomplete="username"
            data-i18n-placeholder="login.emailPlaceholder"
            placeholder="admin_local@example.com"
            required
          />

          <label for="gatewayPassword" data-i18n="login.passwordLabel">Senha</label>
          <input
            id="gatewayPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            data-i18n-placeholder="login.passwordPlaceholder"
            placeholder="Digite sua senha"
            required
          />

          <button id="gatewaySubmitButton" type="submit" data-i18n="login.submitIdle">Entrar no playground admin</button>
        </form>

        <p id="gatewayFeedback" class="feedback" role="status" aria-live="polite"></p>

        <div class="gateway-footer">
          <a href="/swagger" target="_blank" rel="noreferrer" data-i18n="login.footerDocsLink">Ver documentacao da API</a>
        </div>
      </section>
    </main>

    <script src="/playground/shared-assets/api-playground-i18n.js"></script>
    <script src="/playground/login-assets/api-playground-login.js"></script>
  </body>
</html>
